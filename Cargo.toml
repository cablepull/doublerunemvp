[workspace]
resolver = "2"
members = [
  "crates/rune-toolchain", "crates/rune-toolchain-core", "crates/rune-toolchain-cargo",
  "crates/rune-toolchain-edit", "crates/rune-toolchain-eval", "crates/rune-toolchain-memory",
  "crates/rune-toolchain-target", "crates/rune-toolchain-gc", "crates/rune-toolchain-ui",
  "crates/rune-inbox",
]
default-members = ["crates/rune-inbox"]
exclude = ["vendor/anomaly-rune", "crates/rune-study"]

[workspace.metadata.rune]
product = "rune-inbox"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ruvnet/rune"
homepage = "https://ruv.io"
authors = ["rUv <ruv@ruv.net>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rune-core = { package = "rune-toolchain-core", version = "0.3.0", path = "crates/rune-toolchain-core" }
rune-cargo = { package = "rune-toolchain-cargo", version = "0.3.0", path = "crates/rune-toolchain-cargo" }

[profile.release]
lto = false
codegen-units = 16
strip = true

[profile.dev]
debug = 0

[patch.crates-io]
winit = { path = "vendor/anomaly-rune/vendor/winit" }
wgpu-hal = { path = "vendor/anomaly-rune/vendor/wgpu-hal" }
parley_engine = { path = "vendor/anomaly-rune/vendor/parley_engine" }
accesskit_windows = { path = "vendor/anomaly-rune/vendor/accesskit_windows" }
